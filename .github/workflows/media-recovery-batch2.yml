name: Media Recovery Batch 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/recover_media_batch2.py'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover second poster batch
        run: python3 .github/scripts/recover_media_batch2.py

      - name: Validate media recovery
        run: |
          python3 - <<'PY'
          import json, pathlib
          m=json.load(open('data/media-manifest.json'))
          assert m['catalogSize']==81, m['catalogSize']
          assert sum(m['counts'].values())==81, m['counts']
          lr=m.get('lastRecovery',{})
          assert lr.get('batch')==2, lr
          assert lr.get('afterMissing',999) < lr.get('beforeMissing',999), lr
          for key in lr.get('recovered',[]):
              e=m['entries'][key]
              assert e['status']=='bundled'
              assert e['poster']
              path=pathlib.Path(e['poster'].replace('./',''))
              assert path.exists() and path.stat().st_size>3000, (key,path)
          print('Recovered',len(lr.get('recovered',[])),'titles; missing now',m['counts']['missing'])
          PY

      - name: Commit recovered media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/posters data/media-manifest.json index.html app.html
          git commit -m 'Recover second batch of poster assets' || exit 0
          git push
