name: Taste calibration learning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taste-calibration.yml'
      - '.github/scripts/build_taste_learning.py'

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build adaptive taste model
        run: python3 .github/scripts/build_taste_learning.py

      - name: Verify v2.2.5 learning build
        shell: bash
        run: |
          test -s index.html
          test -s app.html
          grep -q "v2.2.5 adaptive taste learning" app.html
          grep -q "function tasteWeights()" app.html
          grep -q "data-taste-metric" app.html
          grep -q "Live taste model" app.html
          grep -q "tasteWeight(k)" app.html
          grep -q "mpe-taste-feedback-v1" app.html
          grep -q "The Musical Propulsion Engine · v2.2.5" app.html

      - name: Commit v2.2.5
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.html
          git commit -m 'Add adaptive taste learning for v2.2.5' || exit 0
          git push
