name: Fix Discovery UI

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_discovery_ui.py'
      - '.github/workflows/fix-discovery-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair recommendation UI
        run: python3 .github/scripts/fix_discovery_ui.py
      - name: Verify repair
        shell: bash
        run: |
          test -s index.html
          test -s app.html
          grep -q 'discoveryLabel(x,r)' index.html
          grep -q 'discoveryReason(x,r)' index.html
          python3 - <<'PY'
          from pathlib import Path
          for f in ('index.html','app.html'):
              s=Path(f).read_text(encoding='utf-8')
              bad='${matchExplanationMarkup(r,sim(x,r))}${matchExplanationMarkup(r,sim(x,r))}'
              assert bad not in s, f'duplicate explanation remains in {f}'
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.html
          git commit -m 'Fix Discovery Intelligence recommendation UI' || exit 0
          git push
