name: Publish direct HTML build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-direct-html.yml'
      - 'app/payload*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild index.html without browser-side decoding
        shell: bash
        run: |
          set -euo pipefail
          echo "Payload files:"
          ls -lh app/payload*.b64
          cat app/payload01.b64 app/payload02.b64 app/payload03.b64 app/payload04.b64 \
            | tr -d '[:space:]' \
            | base64 --decode \
            | gzip --decompress --stdout \
            > index.html
          test -s index.html
          grep -q 'Musical Propulsion Engine' index.html
          echo "Wrote direct index.html: $(wc -c < index.html) bytes"

      - name: Use direct-build service worker cache
        shell: bash
        run: |
          cat > sw.js <<'EOF'
          const CACHE='mpe-v2.2.1-direct-2';
          const ASSETS=['./','./index.html','./manifest.webmanifest','./favicon.svg'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET'||new URL(e.request.url).origin!==location.origin)return;e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html'))))});
          EOF

      - name: Commit direct build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish direct HTML build for Safari'
          git push
