name: Catalog Reconcile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-reconcile.yml'
      - '.github/scripts/catalog_guard.py'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current catalog state
        run: |
          python3 .github/scripts/catalog_guard.py
          python3 - <<'PY'
          import json
          d=json.load(open('data/titles.json'))
          print('CURRENT_CATALOG_SIZE',len(d))
          if len(d) < 81:
              raise SystemExit(f'Expected at least 81 titles after expansion batches, found {len(d)}')
          PY
      - name: Rebuild health audit from current main
        run: python3 .github/scripts/catalog_health_audit.py
      - name: Verify fresh audit
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/titles.json'))
          r=json.load(open('data/catalog-health.json'))
          assert r['catalogSize']==len(d),(r['catalogSize'],len(d))
          print('HEALTH',r['healthScore'],'TITLES',r['catalogSize'])
          PY
      - name: Commit reconciled audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog-health.json data/CATALOG_HEALTH.md
          git commit -m 'Reconcile catalog health against expanded catalog' || exit 0
          git push
